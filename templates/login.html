<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - ETNS TODO</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>📝 ETNS 할 일 관리</h1>
    <h2 class="auth-title">로그인</h2>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('login') }}" method="post" class="auth-form">
      <input type="email" name="email" placeholder="이메일" autocomplete="username" required>
      <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
      <button type="submit">로그인</button>
    </form>

    <p class="auth-switch">계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
  </div>
</body>
</html>
